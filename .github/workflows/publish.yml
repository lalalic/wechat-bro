name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Choose next version
        id: publication
        shell: bash
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view "$NAME" version 2>/dev/null || echo 0.0.0)
          NEXT=$(node - "$LOCAL" "$REMOTE" <<'NODE'
          const [local, remote] = process.argv.slice(2)
          const core = v => v.replace(/^v/, '').split('-')[0].split('.').map(Number)
          const cmp = (a, b) => {
            const x = core(a), y = core(b)
            for (let i = 0; i < 3; i++) {
              if (x[i] !== y[i]) return x[i] - y[i]
            }
            return 0
          }
          if (cmp(local, remote) > 0) {
            console.log(local)
          } else {
            const [major, minor, patch] = core(remote)
            console.log(`${major}.${minor}.${patch + 1}`)
          }
          NODE
          )
          echo "Publishing $NAME@$NEXT (repo=$LOCAL, registry=$REMOTE)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          npm version "$NEXT" --no-git-tag-version --allow-same-version

      - name: Publish
        run: npm publish --access public
      - name: Report verified publication
        uses: lalalic/agents-relay/.github/actions/report-publication@publication-v1
        with:
          token: ${{ github.token }}
          artifact: ${{ steps.publication.outputs.name }}
          version: ${{ steps.publication.outputs.version }}
          channel: https://registry.npmjs.org
      - name: Report release failure
        if: ${{ failure() }}
        continue-on-error: true
        uses: lalalic/agents-relay/.github/actions/report-publication-failure@publication-v1
        with:
          token: ${{ github.token }}
          stage: npm publish workflow
